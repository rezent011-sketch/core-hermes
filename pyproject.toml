[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core-hermes-auto-skill-extractor"
version = "0.1.0"
description = "Hermes Agentの自動スキル抽出システム"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Core Hermes Team"}]
keywords = ["hermes", "ai-agent", "skill-extraction", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[project.scripts]
core-hermes-extract = "auto_skill_extractor.main:main"

[project.urls]
Homepage = "https://github.com/rezent011-sketch/core-hermes"
Repository = "https://github.com/rezent011-sketch/core-hermes"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
auto_skill_extractor = "src/auto_skill_extractor"
